[package]
name = "oab-instance-mcp"
version = "0.7.0"
edition = "2021"
description = "MCP server exposing this machine (exec / sys_info; screenshot / input per platform backend)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
